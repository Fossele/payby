spring:
  application:
    name: payby

  # Database Configuration (PostgreSQL + PostGIS)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payby_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


# Application Logging
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.fossele.rider: DEBUG

# Stripe
stripe:
  api.key: ${STRIPE_SECRET_KEY:sk_test_your_stripe_key}
  webhook.secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}